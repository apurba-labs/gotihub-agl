services:
  # 1. The Laravel 13 App
  app:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotihub_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - gotihub_network
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Nginx Web Server (Internal Gateway for AGL)
  web:
    image: nginx:alpine
    container_name: gotihub_web
    restart: unless-stopped
    ports:
      - "8081:80" # Maps host 8081 into this isolated container's port 80
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gotihub_network

  # 3. MySQL Database
  mysql:
    image: mysql:8.4
    container_name: gotihub_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gotihub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    command: --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gotihub_network

  # 4. Ollama AI (Gemma 4 Setup)
  ollama:
    image: ollama/ollama
    container_name: gotihub_ai
    restart: unless-stopped
    ports:
      - "11435:11434" # Shifted to 11435 to prevent conflicts
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull gemma2:2b && wait"
    networks:
      - gotihub_network

  # 5. Midnight Bridge (Bun)
  bridge:
    image: apurbansingh/gotihub-midnight-bridge:latest
    container_name: gotihub_bridge
    restart: unless-stopped
    ports:
      - "3001:3000" # Shifted to 3001 to keep 3000 clear
    networks:
      - gotihub_network

networks:
  gotihub_network:
    name: gotihub_global_network
    external: true
    #driver: bridge

volumes:
  mysql_data:
  ollama_data:
