services:
  # 1. The Laravel 13 App
  app:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotihub_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      # REDIRECT LARAVEL AI PAYLOADS: Point your .env AI variables to the global core
      - AGL_OLLAMA_URL=http://global-ollama-core:11434
    networks:
      - gotihub_network
      - ai_shared_backbone # 🔌 Hook into the shared backbone
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Nginx Web Server (Internal Gateway for AGL)
  web:
    image: nginx:alpine
    container_name: gotihub_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gotihub_network

  # 3. MySQL Database
  mysql:
    image: mysql:8.4
    container_name: gotihub_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gotihub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    command: --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gotihub_network

  # 4. Midnight Bridge (Bun)
  bridge:
    image: apurbansingh/gotihub-midnight-bridge:latest
    container_name: gotihub_bridge
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - gotihub_network

# ⚡ CHANNELS MATRIX
networks:
  gotihub_network:
    name: gotihub_global_network
    external: true
  ai_shared_backbone: # Declare your new global backbone network here
    external: true

volumes:
  mysql_data: