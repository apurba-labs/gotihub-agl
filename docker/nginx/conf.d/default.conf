# Rate Limit Zone
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=15r/s;

# 1. Main Corporate Website (Next.js)
server {
    listen 80;
    server_name gotihub.com www.gotihub.com;
    server_tokens off;

    location / {
        limit_req zone=global_limit burst=25 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. AGL Demo System (Laravel/AI Stack)
server {
    listen 80;
    server_name agl.gotihub.com;
    server_tokens off;

    location / {
        limit_req zone=global_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}