limit_req_zone $binary_remote_addr zone=gotihub_limit:10m rate=10r/s;

server {
    listen 80;
    server_tokens off;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public; # Laravel's public entry path

    # Handle incoming requests passed from the master router
    location / {
        limit_req zone=gotihub_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Pass PHP executions directly to your PHP-FPM container
    location ~ \.php$ {
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        fastcgi_read_timeout 300;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000; # Points directly to your Laravel 'app' container
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Lock down system security
    location ~ /\.(?!well-known).* {
        deny all;
    }
}